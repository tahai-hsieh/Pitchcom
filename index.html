<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>網頁版 Pitchcom 系統 (極速預載版)</title>
  <!-- Tailwind CSS 用於快速樣式設定 -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 flex flex-col items-center justify-center select-none">

  <h1 class="text-3xl font-bold mb-6 text-center">網頁版 Pitchcom 系統</h1>

  <!-- 房間設定與加入 -->
  <div class="bg-slate-800 p-6 rounded-xl max-w-md w-full mb-6 shadow-lg border border-slate-700">
    <label class="block text-sm font-medium mb-2">輸入團隊 / 房間代碼：</label>
    <div class="flex gap-2">
      <input id="room-id" type="text" value="team01" placeholder="例如：team01 或 team01-1" class="flex-1 p-2 rounded bg-slate-700 text-white border border-slate-600 focus:outline-none focus:border-blue-500">
      <button id="join-btn" class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 px-4 py-2 rounded font-semibold transition">
        進入頻道
      </button>
    </div>
    <p id="status-text" class="text-xs text-slate-400 mt-2">狀態：未連線</p>
    <p id="mode-text" class="text-xs text-yellow-400 mt-1 hidden">💡 已啟用投手鏡像模式（左右自動翻轉）</p>
  </div>

  <!-- 配球控制面板 -->
  <div id="control-panel" class="bg-slate-800 p-6 rounded-xl max-w-md w-full shadow-lg border border-slate-700 opacity-50 pointer-events-none transition-all">
    
    <!-- 1. 球種選擇 -->
    <h2 class="text-sm font-semibold mb-2 text-slate-400">1. 選擇球種 (Pitch Type)</h2>
    <div class="grid grid-cols-2 gap-2 mb-6">
      <button class="pitch-btn bg-slate-700 hover:bg-slate-600 active:bg-blue-600 p-3 rounded font-medium text-center transition" data-pitch="直球">直球</button>
      <button class="pitch-btn bg-slate-700 hover:bg-slate-600 active:bg-blue-600 p-3 rounded font-medium text-center transition" data-pitch="速球">速球</button>
      <button class="pitch-btn bg-slate-700 hover:bg-slate-600 active:bg-blue-600 p-3 rounded font-medium text-center transition" data-pitch="變化球">變化球</button>
      <button class="pitch-btn bg-slate-700 hover:bg-slate-600 active:bg-blue-600 p-3 rounded font-medium text-center transition" data-pitch="指叉球">指叉球</button>
    </div>

    <!-- 2. 位置選擇 (九宮格) -->
    <h2 class="text-sm font-semibold mb-2 text-slate-400">2. 選擇位置 (九宮格)</h2>
    <div class="grid grid-cols-3 gap-2 mb-6">
      <button class="loc-btn bg-slate-700 hover:bg-slate-600 active:bg-blue-600 p-4 rounded text-base font-bold text-center transition" data-loc="左上">左上</button>
      <button class="loc-btn bg-slate-700 hover:bg-slate-600 active:bg-blue-600 p-4 rounded text-base font-bold text-center transition" data-loc="中上">中上</button>
      <button class="loc-btn bg-slate-700 hover:bg-slate-600 active:bg-blue-600 p-4 rounded text-base font-bold text-center transition" data-loc="右上">右上</button>
      <button class="loc-btn bg-slate-700 hover:bg-slate-600 active:bg-blue-600 p-4 rounded text-base font-bold text-center transition" data-loc="中左">中左</button>
      <button class="loc-btn bg-slate-700 hover:bg-slate-600 active:bg-blue-600 p-4 rounded text-base font-bold text-center transition" data-loc="紅中">紅中</button>
      <button class="loc-btn bg-slate-700 hover:bg-slate-600 active:bg-blue-600 p-4 rounded text-base font-bold text-center transition" data-loc="中右">中右</button>
      <button class="loc-btn bg-slate-700 hover:bg-slate-600 active:bg-blue-600 p-4 rounded text-base font-bold text-center transition" data-loc="左下">左下</button>
      <button class="loc-btn bg-slate-700 hover:bg-slate-600 active:bg-blue-600 p-4 rounded text-base font-bold text-center transition" data-loc="中下">中下</button>
      <button class="loc-btn bg-slate-700 hover:bg-slate-600 active:bg-blue-600 p-4 rounded text-base font-bold text-center transition" data-loc="右下">右下</button>
    </div>

    <!-- 選擇預覽與發送狀態 -->
    <div class="bg-slate-900 p-3 rounded mb-4 text-center border border-slate-700">
      <span id="preview-title" class="text-xs text-slate-400 block">目前選擇</span>
      <span id="preview-text" class="text-lg font-bold text-yellow-400">未選擇</span>
    </div>

    <button id="send-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white py-3 rounded-lg font-bold text-lg shadow transition">
      發送暗號
    </button>
  </div>

  <!-- Firebase JavaScript SDK (Modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-analytics.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

    // Firebase 設定資訊
    const firebaseConfig = {
      apiKey: "AIzaSyCBCKdb3uL3jTxgRbkIfKwcxKfX8yPgqzc",
      authDomain: "pitchcom-83b2c.firebaseapp.com",
      databaseURL: "https://pitchcom-83b2c-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "pitchcom-83b2c",
      storageBucket: "pitchcom-83b2c.firebasestorage.app",
      messagingSenderId: "310530384126",
      appId: "1:310530384126:web:1a33d0a82d8e33c56105af",
      measurementId: "G-DSWYD9KTJL"
    };

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const database = getDatabase(app);

    let rawRoomInput = "";  
    let baseRoom = "";      
    let isFlipped = false;  
    let selectedPitch = "";
    let selectedLoc = "";
    let roomUnsubscribe = null;
    let lastHandledTimestamp = 0;

    // 音效快取物件 (方案 A 核心)
    const audioCache = {};

    // 鏡像對照表
    const flipMap = {
      "左上": "右上", "右上": "左上",
      "中左": "中右", "中右": "中左",
      "左下": "右下", "右下": "左下",
      "中上": "中上", "紅中": "紅中", "中下": "中下"
    };

    function getFlippedLoc(loc) {
      return flipMap[loc] || loc;
    }

    const joinBtn = document.getElementById('join-btn');
    const roomIdInput = document.getElementById('room-id');
    const statusText = document.getElementById('status-text');
    const modeText = document.getElementById('mode-text');
    const controlPanel = document.getElementById('control-panel');
    const previewTitle = document.getElementById('preview-title');
    const previewText = document.getElementById('preview-text');

    // 點擊進入頻道
    joinBtn.addEventListener('click', () => {
      rawRoomInput = roomIdInput.value.trim();
      if (!rawRoomInput) {
        alert("請輸入房間代碼！");
        return;
      }

      // 1. 預加載全暗號組合音效 (方案 A)
      preloadAudios();

      // 清除舊監聽
      if (roomUnsubscribe) roomUnsubscribe();

      // 判定是否為投手鏡像模式
      if (rawRoomInput.endsWith('-1')) {
        isFlipped = true;
        baseRoom = rawRoomInput.slice(0, -2); 
        modeText.classList.remove('hidden');
      } else {
        isFlipped = false;
        baseRoom = rawRoomInput;
        modeText.classList.add('hidden');
      }

      statusText.innerText = `狀態：已連線至「${baseRoom}」${isFlipped ? ' (鏡像視角)' : ''}`;
      statusText.classList.replace('text-slate-400', 'text-emerald-400');
      controlPanel.classList.remove('opacity-50', 'pointer-events-none');

      // 記錄進入頻道時間點，避免重複唸出歷史暗號
      lastHandledTimestamp = Date.now();

      // 2. 監聽 Firebase 房間資料變化
      const pitchRef = ref(database, 'rooms/' + baseRoom);
      roomUnsubscribe = onValue(pitchRef, (snapshot) => {
        const data = snapshot.val();
        if (data && data.pitch && data.loc && data.timestamp) {
          const finalLoc = isFlipped ? getFlippedLoc(data.loc) : data.loc;
          
          // 所有連線裝置即時更新面板文字
          previewTitle.innerText = "最新發送";
          previewText.className = "text-lg font-bold text-emerald-400";
          previewText.innerText = `已發送：${data.pitch} - ${finalLoc}`;

          // 若為新發送暗號，直接播放快取音效
          if (data.timestamp > lastHandledTimestamp) {
            playSignalAudio(`${data.pitch}，${finalLoc}`);
            lastHandledTimestamp = data.timestamp;
          }
        }
      });
    });

    // 選擇球種
    document.querySelectorAll('.pitch-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        selectedPitch = e.target.getAttribute('data-pitch');
        updatePreview();
      });
    });

    // 選擇位置
    document.querySelectorAll('.loc-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        selectedLoc = e.target.getAttribute('data-loc');
        updatePreview();
      });
    });

    function updatePreview() {
      previewTitle.innerText = "目前選擇";
      previewText.className = "text-lg font-bold text-yellow-400";
      previewText.innerText = `${selectedPitch || '未選擇球種'} - ${selectedLoc || '未選擇位置'}`;
    }

    // 發送暗號
    document.getElementById('send-btn').addEventListener('click', () => {
      if (!baseRoom) {
        alert("請先進入頻道！");
        return;
      }
      if (!selectedPitch || !selectedLoc) {
        alert("請同時選擇球種與進壘位置！");
        return;
      }

      const targetLoc = isFlipped ? getFlippedLoc(selectedLoc) : selectedLoc;

      set(ref(database, 'rooms/' + baseRoom), {
        pitch: selectedPitch,
        loc: targetLoc,
        timestamp: Date.now()
      });

      selectedPitch = "";
      selectedLoc = "";
    });

    // 方案 A：預先加載所有語音組合至記憶體快取中
    function preloadAudios() {
      const pitches = ["直球", "速球", "變化球", "指叉球"];
      const locs = ["左上", "中上", "右上", "中左", "紅中", "中右", "左下", "中下", "右下"];

      pitches.forEach(p => {
        locs.forEach(l => {
          const textKey = `${p}，${l}`;
          // 將「指叉球」發音替換為更順暢的諧音「紙叉球」
          const spokenText = textKey.replace(/指叉球/g, "紙叉球");
          const url = `https://translate.google.com/translate_tts?ie=UTF-8&tl=zh-TW&client=tw-ob&q=${encodeURIComponent(spokenText)}`;
          
          const audio = new Audio();
          audio.src = url;
          audio.preload = "auto";
          audioCache[textKey] = audio;
        });
      });
    }

    // 方案 A：從記憶體快取超低延遲播放音效
    function playSignalAudio(textKey) {
      if (audioCache[textKey]) {
        // 重置播放進度並即刻發聲
        audioCache[textKey].currentTime = 0;
        audioCache[textKey].play().catch(err => {
          console.warn("自動播放受限，嘗試降級播放：", err);
          fallbackSpeech(textKey);
        });
      } else {
        fallbackSpeech(textKey);
      }
    }

    // 備用語音引擎（防止特殊狀況音效檔未加載）
    function fallbackSpeech(textKey) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.resume();
        window.speechSynthesis.cancel();
        const spokenText = textKey.replace(/指叉球/g, "紙叉球");
        const utterance = new SpeechSynthesisUtterance(spokenText);
        utterance.lang = 'zh-TW';
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
